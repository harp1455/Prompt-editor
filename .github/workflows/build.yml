# main 에 코드가 올라오면 윈도우 설치 파일(exe)과 안드로이드 apk 를 만들어 Releases 에 올린다.
# 버전은 1.0.<실행 번호> 로 자동 증가한다. 앱의 자동 업데이트는 이 Releases 를 읽는다.
name: Build exe and apk
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: 1.0.${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/set-version.js
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --ignore-scripts
      - run: node scripts/set-version.js
      - run: npx cap add android
      - name: App icon (실패해도 기본 아이콘으로 계속)
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d6e66' --iconBackgroundColorDark '#0d6e66' --splashBackgroundColor '#0f1418' --splashBackgroundColorDark '#0f1418'
      - run: npx cap sync android
      - run: node scripts/set-version.js
      - name: Build apk
        env:
          SIGNING: ${{ secrets.ANDROID_SIGNING }}   # 형식: <비밀번호>:<키스토어 base64>, 키 별칭은 cps
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$SIGNING" ]; then
            KS_PASS="${SIGNING%%:*}"
            echo "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias=cps \
              -Pandroid.injected.signing.key.password="$KS_PASS"
            cp app/build/outputs/apk/release/app-release.apk "../CrackPromptStudio-$VERSION.apk"
          else
            echo "::warning::서명 키(ANDROID_SIGNING 시크릿)가 없어 임시 키로 빌드합니다. 이 apk 는 다음 버전으로 덮어 설치할 수 없습니다."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../CrackPromptStudio-$VERSION-temp-key.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: CrackPromptStudio-*.apk
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          make_latest: true
          files: out/*
          body: |
            **윈도우**: `CrackPromptStudio-Setup-${{ env.VERSION }}.exe` 를 받아 실행하세요. 이미 설치돼 있으면 앱이 스스로 업데이트합니다.
            **안드로이드**: `.apk` 파일을 받아 열면 설치됩니다. 기존 앱 위에 덮어 설치되며 작업 내용은 유지됩니다.
            (`latest.yml`, `.blockmap` 은 자동 업데이트용 파일이라 받을 필요가 없습니다.)
