<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크랙 프롬프트 스튜디오</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="brand" data-act="home" title="작품 목록으로">
    <span class="mark">CP</span><span class="brand-t">프롬프트 스튜디오</span>
  </button>
  <div class="crumb" id="crumb"></div>
  <span class="grow"></span>
  <span class="saved" id="saved"></span>
  <button class="btn ghost" id="undoBtn" data-act="undo" hidden title="마지막 큰 변경 되돌리기">되돌리기</button>
  <button class="btn ghost" data-act="search" title="검색 (Ctrl+K)">검색</button>
  <button class="btn ghost" data-act="io">파일</button>
  <button class="btn ghost" data-act="settings">설정</button>
  <button class="btn accent" data-act="ai">AI</button>
</header>
<div class="updbar" id="updbar" hidden></div>
<nav class="tabs" id="tabs" hidden></nav>
<main id="main"></main>
<aside class="ai" id="ai" hidden></aside>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePick" hidden>
<input type="file" id="imgPick" accept="image/*" hidden>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
